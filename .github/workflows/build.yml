name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Graph kernel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test tests/Access.Core.Tests/Access.Core.Tests.csproj

  build:
    name: Build mod (Release)
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read      # lets the automatic GITHUB_TOKEN read our own Gwent.GameRefs package
    steps:
      # core.longpaths: the prism submodule carries a couple of Android test files whose
      # paths exceed MAX_PATH once nested under the workspace, and checkout fails without it.
      - name: Allow long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          # third_party/prism — prism.dll is compiled from source, not committed.
          # Non-recursive on purpose: prism's own submodule is only the Godot bindings.
          submodules: true

      # Cache the compiled prism.dll rather than the CMake tree: the build script stamps the
      # artifact with the submodule commit it came from, so a cache hit makes it a no-op.
      # A moved submodule changes the key and the C++ build runs again (~2 min).
      - name: Prism submodule commit
        id: prism
        shell: pwsh
        run: echo "sha=$(git -C third_party/prism rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Cache Prism build
        uses: actions/cache@v4
        with:
          path: build/native
          key: prism-${{ runner.os }}-${{ steps.prism.outputs.sha }}

      # Game references come from Gwent.GameRefs: Refasmer-stripped (metadata-only) BepInEx core and IL2CPP
      # interop assemblies, published to GitHub Packages under this same account by scripts/build-gamerefs.ps1.
      # The package mirrors the game folder, so it is passed as GwentDir.
      - name: Add game-refs feed
        run: nuget sources add -name gamerefs -source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -username ${{ github.repository_owner }} -password ${{ secrets.GITHUB_TOKEN }} -StorePasswordInClearText

      - name: Install game refs
        run: nuget install Gwent.GameRefs -Source gamerefs -OutputDirectory GameFiles -DependencyVersion Highest

      - name: Locate game refs
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\GameFiles" -Directory -Filter 'Gwent.GameRefs*' | Sort-Object Name | Select-Object -Last 1
          if (-not $pkg) { throw 'Gwent.GameRefs package not found under GameFiles/' }
          Write-Output "Using $($pkg.Name)"
          echo "GWENT_DIR=$($pkg.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          dotnet build module/GwentAccess.Module.csproj -c Release "-p:GwentDir=$env:GWENT_DIR"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Label
        id: label
        shell: pwsh
        run: |
          $label = if ('${{ github.ref }}' -like 'refs/tags/v*') { '${{ github.ref_name }}'.TrimStart('v') } else { 'dev' }
          echo "label=$label" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Label ${{ steps.label.outputs.label }}

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: mod-zip
          path: dist/GwentAccess-*.zip
          if-no-files-found: error

  # Testers download from the "dev" release, which always points at the newest build. Pushes to main update it;
  # running the workflow by hand (Actions > Build > Run workflow) on any branch publishes that branch instead.
  dev-release:
    name: Update rolling dev release
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-zip
          path: dist
      - name: Recreate dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create dev dist/GwentAccess-dev.zip \
            -R ${{ github.repository }} \
            --target ${{ github.sha }} \
            --prerelease --latest=false \
            --title "Dev build (rolling)" \
            --notes "Automatic build of \`${{ github.ref_name }}\` at ${{ github.sha }}. Replaced on every update; expect rough edges. Install it like a normal release (unzip, run Install.bat). When reporting a problem, include BepInEx\\plugins\\GwentAccess\\build.txt and BepInEx\\LogOutput.log."

  release:
    name: Tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-zip
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} dist/GwentAccess-*.zip \
            -R ${{ github.repository }} \
            --title "Gwent Access ${{ github.ref_name }}" \
            --generate-notes
