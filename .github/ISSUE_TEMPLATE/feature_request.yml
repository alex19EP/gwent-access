name: Feature request
description: A screen the mod doesn't read well yet, or a key you'd like.
labels: [enhancement]
body:
  - type: input
    id: screen
    attributes:
      label: Screen
      placeholder: "Shop, a keg's details"
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: What a sighted player sees there that you can't reach, or how another accessibility mod (Hearthstone Access, Accessible Arena) handles it.
    validations:
      required: true
